name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --frozen-lockfile fails if package.json and bun.lock disagree.
      - run: bun install --frozen-lockfile

      - run: bun run build

      # Lint is reported but not enforced yet: ~57 pre-existing errors
      # (mostly unused imports). Drop continue-on-error once they're cleared.
      - run: bun run lint
        continue-on-error: true
